<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YT Lyrics PiP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      background: #0f0f0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 16px;
    }
    h1 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ff0000;
      letter-spacing: 0.5px;
    }
    #status {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 16px;
      min-height: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    #toggle-btn.on {
      background: #ff0000;
      color: #fff;
    }
    #toggle-btn.off {
      background: #1a1a1a;
      color: #aaa;
      border: 1px solid #333;
    }
  </style>

</head>
<body>
  <h1>YT Lyrics PiP</h1>
  <div id="status">Open YouTube and play a song.</div>
  <button id="toggle-btn" class="off">Enable Lyrics</button>
  <script type="module" src="main.ts"></script>
</body>
</html>
